[mod]
id = "dragonfyre_quests"
version = "0.6.0-dev"

[compatibility]
horizon_revision = "66f3981f522b24c250b21523a70080965b940424"

[[crate]]
id = "engine"
path = "engine"

[[injection]]
id = "register_development_commands"
hook = "register_commands"
hook_version = 1
kind = "HEAD"
helper = "register.rs"
bindings = [{ name = "commands", ty = "&mut Vec<horizon_client::mod_api::NativeCommand>", value = "&mut *commands" }]

[[injection]]
id = "perform_development_command"
hook = "perform_command"
hook_version = 1
kind = "HEAD"
helper = "perform.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&horizon_client::mod_api::NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "auto_check_item_tasks"
hook = "server_tick"
hook_version = 1
kind = "HEAD"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "context", ty = "&horizon_client::mod_api::NativeLifecycleContext", value = "&context" },
  { name = "phase", ty = "horizon_client::mod_api::ServerTickPhase", value = "phase" },
]

[[module]]
id = "transaction_runtime"
file = "crates/horizon-client/src/game/native_hooks.rs"
name = "dragonfyre_economy"
source = "economy.rs"

[[injection]]
id = "recover_player_transactions"
hook = "player_logged_in"
hook_version = 1
kind = "HEAD"
helper = "recover.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
]

[[injection]]
id = "isolate_integrated_owner_profile"
target = "horizon_client::game::lan::Game<'_>::lan_guest_joined"
kind = "HEAD"
helper = "profile.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "host", ty = "&mut LanHost", value = "&mut *host" },
  { name = "conn", ty = "u32", value = "conn" },
]

[[module]]
id = "quest_journal_transport"
file = "crates/horizon-client/src/game/integrated.rs"
name = "dragonfyre_journal_transport"
source = "journal_server.rs"

[[module]]
id = "quest_journal_screen"
file = "crates/horizon-client/src/game/native_hooks.rs"
name = "dragonfyre_journal"
source = "journal.rs"

[[injection]]
id = "quest_journal_key"
hook = "key"
hook_version = 1
kind = "HEAD"
helper = "journal_key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "quest_journal_draw"
hook = "screen_render_post"
hook_version = 1
kind = "HEAD"
helper = "journal_draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
]

[[injection]]
id = "quest_journal_click"
hook = "screen_mouse_button_pressed_pre"
hook_version = 1
kind = "HEAD"
helper = "journal_click.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "button", ty = "i32", value = "button" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[module]]
id = "arcane_apparatus"
file = "crates/horizon-client/src/crafting.rs"
name = "dragonfyre_apparatus"
source = "arcane_apparatus.rs"

[[injection]]
id = "wear_arcane_apparatus"
target = "horizon_client_lib::crafting::Recipes::remainders"
kind = "RETURN"
helper = "apparatus_remainder.rs"
bindings = [
  { name = "remaining", ty = "Vec<Option<ItemStack>>", value = "$value" },
  { name = "grid", ty = "&[Option<ItemStack>]", value = "grid" },
]

[[injection]]
id = "disable_arcane_apparatus_crafting_repair"
target = "horizon_client_lib::crafting::Recipes::assemble_if_matches"
kind = "HEAD"
cancellable = true
helper = "apparatus_repair.rs"
bindings = [
  { name = "recipe", ty = "&Recipe", value = "recipe" },
  { name = "input", ty = "&Input<'_>", value = "input" },
]

